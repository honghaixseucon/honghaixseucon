<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Platform Store 2026 - Siêu Sàn TMĐT Đa Dịch Vụ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(18, 20, 32, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .text-gradient { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#0a0b10] text-gray-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 glass border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-indigo-600 flex items-center justify-center">
                    <i class="fa-solid fa-cubes text-black text-xl font-black"></i>
                </div>
                <span class="text-xl font-extrabold text-gradient">MULTI STORE 2026</span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="switchTab('login')" id="btn-login-nav" class="px-4 py-2 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-sm font-semibold">Đăng nhập / Đăng ký</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
        <!-- TRANG CHỦ -->
        <div id="tab-home" class="space-y-8">
            <div class="glass p-8 rounded-3xl space-y-4">
                <h1 class="text-4xl font-black text-white">HỆ THỐNG THƯƠNG MẠI ĐIỆN TỬ <span class="text-gradient">ĐA DỊCH VỤ</span></h1>
                <p class="text-gray-400">Kết nối backend Node.js, cơ sở dữ liệu PostgreSQL thực tế, không dùng dữ liệu giả lập.</p>
                <button onclick="loadProducts()" class="px-6 py-3 rounded-xl bg-cyan-500 text-black font-bold">Tải Sản Phẩm Từ Database</button>
            </div>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-3 gap-6"></div>
        </div>

        <!-- TRANG ĐĂNG NHẬP -->
        <div id="tab-login" class="hidden max-w-md mx-auto glass p-8 rounded-3xl space-y-6">
            <h2 class="text-2xl font-bold text-white text-center">Đăng Nhập Hệ Thống</h2>
            <input type="email" id="login-email" placeholder="Email của bạn" class="w-full p-3 rounded-xl bg-black/40 border border-white/10 text-white">
            <input type="password" id="login-password" placeholder="Mật khẩu" class="w-full p-3 rounded-xl bg-black/40 border border-white/10 text-white">
            <button onclick="handleLogin()" class="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold">Đăng Nhập Ngay</button>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-login').classList.add('hidden');
            if(tab === 'home') document.getElementById('tab-home').classList.remove('hidden');
            if(tab === 'login') document.getElementById('tab-login').classList.remove('hidden');
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                const container = document.getElementById('product-list');
                container.innerHTML = '';
                if(data.success && data.data.length > 0) {
                    data.data.forEach(p => {
                        container.innerHTML += `<div class="glass p-4 rounded-xl"><h3>${p.title}</h3><p class="text-cyan-400 font-bold">${p.price} đ</p></div>`;
                    });
                } else {
                    container.innerHTML = '<p class="text-gray-400">Chưa có sản phẩm nào trong database.</p>';
                }
            } catch(e) {
                alert('Lỗi kết nối server API!');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.success) {
                alert('Đăng nhập thành công!');
                localStorage.setItem('token', data.token);
                switchTab('home');
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
